jenkins:
  systemMessage: "Jenkins configured using JCasC"

  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "admin"

  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false

  clouds:
    - kubernetes:
        name: "kubernetes"
        serverUrl: "https://kubernetes.default"
        namespace: "default"
        jenkinsUrl: "http://jenkins-controller-service:8080"
        skipTlsVerify: true

credentials:
  system:
    domainCredentials:
      - credentials:
          - usernamePassword:
              id: "github-creds"
              username: "Quashed"
              password: "${GITHUB_TOKEN}"
              description: "GitHub credentials"

jobs:
  - file: /usr/share/jenkins/ref/job-dsl/hello-demo-multibranch-pipeline.groovy